name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."

            cd /var/www/app

            echo "📥 Fetching latest code..."
            git fetch origin

            echo "💾 Preserving uploaded files..."
            cp -r backend/uploads /tmp/crm_uploads_backup 2>/dev/null || true

            git reset --hard origin/main

            echo "♻️ Restoring uploaded files..."
            if [ -d /tmp/crm_uploads_backup ]; then
              cp -r /tmp/crm_uploads_backup/. backend/uploads/
              rm -rf /tmp/crm_uploads_backup
            fi

            mkdir -p backend/uploads/project-images

            echo "📦 Installing backend dependencies..."
            cd backend
            npm install

            echo "🏗️ Building frontend..."
            cd ../frontend
            npm install
            npm run build

            echo "🔄 Restarting backend..."
            pm2 restart all || pm2 start server.js

            echo "🔁 Reloading NGINX..."
            systemctl reload nginx

            echo "✅ Deployment completed!"